{{# include:head }}
{{# include:nav }}

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Projects</h1>
  </div>

  <!-- Create Project Form -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Create New Project</h2>
    <form hx-post="/org/projects" hx-target="#projects-list" hx-swap="afterbegin" hx-on::after-request="this.reset()" class="space-y-4">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
          <input type="text" name="name" required placeholder="e.g. Mobile App"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
          <input type="color" name="color" value="#6366f1"
            class="w-full h-[42px] px-1 py-1 border border-gray-300 rounded-lg cursor-pointer">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description (optional)</label>
        <textarea name="description" rows="2" placeholder="Brief description of the project..."
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
      </div>
      <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
        Create Project
      </button>
    </form>
  </div>

  <!-- Projects List -->
  <div class="grid gap-4" id="projects-list">
    {{#each projects}}
    <div class="bg-white rounded-lg border p-4 hover:shadow-md transition">
      <div class="flex items-center gap-3">
        <div class="w-4 h-4 rounded" style="background-color: {{ color }}"></div>
        <h3 class="font-medium">{{ name }}</h3>
      </div>
      <p class="text-sm text-gray-500 mt-1">{{ description }}</p>
      <div class="flex items-center gap-4 mt-3 text-sm text-gray-400">
        <span>{{ issue_count }} issues</span>
        <span>Created by {{ creator_name }}</span>
      </div>
      <div class="mt-3">
        <a href="/kanban/{{ id }}" class="text-indigo-600 hover:text-indigo-700 text-sm font-medium">
          Open Board →
        </a>
      </div>
    </div>
    {{/each}}
  </div>
</main>

{{# include:footer }}
