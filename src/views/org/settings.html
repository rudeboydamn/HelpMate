{{# include:head }}
{{# include:nav }}

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Team Settings</h1>

  <!-- Organization Info -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Organization</h2>
    <form hx-post="/org/update" hx-swap="outerHTML" hx-target="next div">
      <div class="flex gap-4">
        <input type="text" name="name" value="{{ org.name }}" required
          class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
          Save
        </button>
      </div>
    </form>
    <div></div>
  </div>

  <!-- Team Members -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-6">
    <div class="p-4 border-b flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">Team Members</h2>
      <span class="text-sm text-gray-500">{{ members.length }} / {{ org.max_users }} seats</span>
    </div>

    <!-- Invite Form -->
    <div class="p-4 bg-gray-50 border-b">
      <form hx-post="/org/invite" hx-target="#members-table tbody" hx-swap="beforeend" hx-on::after-request="this.reset()"
        class="flex flex-wrap gap-3">
        <input type="text" name="name" placeholder="Name" required
          class="flex-1 min-w-[120px] px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
        <input type="email" name="email" placeholder="Email" required
          class="flex-1 min-w-[180px] px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
        <select name="role" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="member">Member</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
          Invite
        </button>
      </form>
    </div>

    <table class="w-full" id="members-table">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Member</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Joined</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
        </tr>
      </thead>
      <tbody hx-get="/org/members" hx-trigger="load" hx-swap="innerHTML">
        <tr>
          <td colspan="5" class="text-center py-8 text-gray-400">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Danger Zone -->
  <div class="bg-white rounded-xl shadow-sm border border-red-200 p-6">
    <h2 class="text-lg font-semibold text-red-600 mb-2">Danger Zone</h2>
    <p class="text-gray-500 text-sm mb-4">
      Once you delete your organization, there is no going back. Please be certain.
    </p>
    <button class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition font-medium" disabled>
      Delete Organization
    </button>
  </div>
</main>

{{# include:footer }}
